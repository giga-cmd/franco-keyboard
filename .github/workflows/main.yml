name: Build Franco Apps

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build all Franco projects (keyboard + translate engine)
        env:
          ZIP_PASS: ${{ secrets.ZIP_PASS }}
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          mkdir -p out

          build_one() {
            PREFIX="$1"; APK="$2"; REQUIRED="$3"
            ZIP=$(find . -maxdepth 1 -type f \( -name "${PREFIX}_v*.zip" -o -name "${PREFIX}_v*.zip.enc" \) -printf '%f\n' | sort -V | tail -n 1)
            if [ -z "$ZIP" ]; then
              if [ "$REQUIRED" = "1" ]; then echo "No ${PREFIX}_v* project found"; exit 1; fi
              echo "Skipping $PREFIX (no file)"; return 0
            fi
            echo "=== Building $ZIP ==="
            W="work_$PREFIX"
            rm -rf "$W"; mkdir "$W"
            case "$ZIP" in
              *.enc)
                [ -n "$ZIP_PASS" ] || { echo "Secret ZIP_PASS is missing"; exit 1; }
                openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:ZIP_PASS -in "$ZIP" -out "$W.zip" || { echo "Wrong ZIP_PASS or corrupt file"; exit 1; }
                unzip -q "$W.zip" -d "$W"; rm -f "$W.zip" ;;
              *) unzip -q "$ZIP" -d "$W" ;;
            esac
            if [ ! -f "$W/build.gradle.kts" ]; then
              INNER=$(find "$W" -maxdepth 2 -name build.gradle.kts -printf '%h\n' | head -n 1)
              if [ -n "$INNER" ]; then shopt -s dotglob; mv "$INNER"/* "$W"/; shopt -u dotglob; fi
            fi
            test -f "$W/build.gradle.kts" || { echo "build.gradle.kts not found in $ZIP"; exit 1; }
            if [ "$PREFIX" = "FrancoKeyboard" ]; then
              test -f "$W/google-services.json" || { echo "google-services.json missing"; exit 1; }
              if [ -f words.txt ]; then
                mkdir -p "$W/src/main/assets"; cp words.txt "$W/src/main/assets/words_user.txt"
              fi
            fi
            gradle -p "$W" assembleDebug --no-daemon --stacktrace -PrunNumber=${{ github.run_number }}
            cp "$W"/build/outputs/apk/debug/*-debug.apk "out/$APK"
          }

          build_one FrancoKeyboard franco-keyboard.apk 1
          build_one FrancoTranslateEngine franco-translate-engine.apk 0
          ls -la out

      - name: Publish APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release delete "v${{ github.run_number }}" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          cat > notes.md <<'NOTES_EOF'
          # ✨ Franco Keyboard

          كيبورد عربي مختلف عن أي كيبورد جربته. بتكتب عربي وتطلع فرانكو (أو العكس) وانت جوه الكيبورد، وبتظبط كل حاجة فيه على مزاجك.

          ## 🔄 فرانكو وعربي من غير ما تخرج
          - عربي ← فرانكو: بتكتب بالحروف العربي وبتطلع فرانكو لحظيًا.
          - فرانكو ← عربي: الصق أي كلام فرانكو منسوخ وهيتحول لعربي مظبوط.
          - مايك بيكتب فرانكو: بتتكلم وكلامك بيتكتب فرانكو.
          - تصحيح تلقائي واقتراح كلمات وانت بتكتب.

          ## 🎨 تخصيص كامل (زي ما تحب)
          - إضاءة RGB حوالين الكيبورد وعند الضغط على كل حرف، بأشكال متعددة (نيون، مطاردة، تنفّس، قوس قزح) وتأثيرات ضغط (توهج، شرارات، موجة).
          - ألوان RGB مخصصة: تختار لون واحد أو أكتر بدل قوس قزح الكامل.
          - لون الزراير ولون الحروف: اضغط مطوّل على أي لون يفتح شريط درجاته، وتشوف التغيير لحظيًا في المعاينة.
          - حروف بتتغير لوحدها: تتبع لون الفيديو أو الخلفية اللي ورا الكيبورد، أو تلف على الألوان اللي تختارها بسرعة تظبطها.
          - سُمك الحروف: عريض ومتوسط ورفيع وعادي.
          - سطوع الحروف وقوة اللون مع معاينة حية في أول الإعدادات.
          - زخرفة الحروف: أشكال إنجليزي وفرانكو مزخرفة جاهزة.
          - حجم الحروف وحجم مربع الحرف، وإخفاء المربع، وشفافية الزراير، وتغيير حجم الكيبورد كله.

          ## 🖼️ خلفيات حقيقية
          - صورة أو فيديو كخلفية للكيبورد، مع تحديد مكان الفيديو بالقرب والتحريك.
          - تغميق الخلفية وتحكم في الشفافية عشان الحروف تفضل واضحة.
          - ثيم بيتغير مع الوقت، وثيم مختلف لكل تطبيق.

          ## 🔤 خطوط وإيموجي
          - استيراد ملفات الخطوط وتثبيتها جوه الكيبورد عشان تجيب شكل iPhone.
          - دعم خطوط وإيموجي كيبورد الآيفون، وخط مختلف لكل ثيم.

          ## 🧰 أدوات جوه الكيبورد
          - ترجمة فورية بين لغات كتير، مع محرك اختياري للترجمة من غير إنترنت.
          - بيفهم العامية المصرية قبل الترجمة (مثلا: مش عايز أروح).
          - آلة حاسبة: اكتب 5*5= وهتطلعلك النتيجة، وتفهم زائد وناقص وضرب وعلى.
          - تلخيص: حدد نص طويل واطلع ملخصه.
          - اقتراح سكرين شوت: بيظهر لك آخر لقطة تبعتها بضغطة.
          - تحديد ونسخ وقص ولصق جوه خانات الترجمة، مع اختيار الكتابة في الخانة أو في التطبيق.
          - حافظة منسوخات، وكل حاجة في ضغطة طويلة على زرار.

          ## ⌨️ تجربة كتابة زي الأصلي
          - من غير فراغات بين الزراير، وتخطيط عربي وإنجليزي وفرانكو.
          - ضغط مطوّل بنفس ترتيب الكيبورد الأصلي: الأرقام العربي والإنجليزي والبدايل، والتشكيل في مفتاح النقطة.
          - اهتزاز وصوت بتتحكم فيهم.

          ## 🔒 أمان وتحديث
          - حساب وتسجيل دخول، وحفظ إعداداتك تلقائي.
          - تحديث إجباري: لو فيه إصدار جديد الكيبورد بيطلب منك تنزّله، فكلنا على نفس النسخة.

          ## 📦 الملفات في الإصدار
          - franco-keyboard.apk : الكيبورد
          - franco-translate-engine.apk : الترجمة بدون نت (اختياري)

          Developed by Giga
          NOTES_EOF
          gh release create "v${{ github.run_number }}" out/*.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Franco Keyboard ${{ github.run_number }}" \
            --notes-file notes.md
