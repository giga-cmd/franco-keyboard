name: Build Franco Keyboard

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unpack project
        run: |
          mkdir work
          for z in $(ls -1 *.zip | sort); do
            unzip -o "$z" -d work
          done
          if [ -f words.txt ]; then
            mkdir -p work/src/main/assets
            cp words.txt work/src/main/assets/words_user.txt
          fi

      - name: Build APK
        run: gradle -p work assembleDebug --no-daemon

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp work/build/outputs/apk/debug/*-debug.apk franco-keyboard.apk
          gh release create "v${{ github.run_number }}" franco-keyboard.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Franco Keyboard ${{ github.run_number }}" \
            --notes "ملف APK جاهز للتثبيت"
