          cat > src/main/java/com/franco/keyboard/FrancoIME.kt <<'EOF'
          package com.franco.keyboard

          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.inputmethodservice.InputMethodService
          import android.os.Handler
          import android.os.Looper
          import android.util.TypedValue
          import android.view.KeyEvent
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.inputmethod.EditorInfo
          import android.view.inputmethod.InputConnection
          import android.view.inputmethod.InputMethodManager
          import android.widget.Button
          import android.widget.LinearLayout

          class FrancoIME : InputMethodService() {

              private var francoOn = true
              private val handler = Handler(Looper.getMainLooper())
              private var toggleKey: Button? = null

              // الكلمة الحالية: بالعربي وبالإنجليزي اللي اتكتب لحد دلوقتي
              private val wordAr = StringBuilder()
              private var wordFr = ""

              // قاموس الكلمات والأسماء
              private val dict = HashMap<String, String>()

              // حروف الفرانكو للكلمات اللي مش في القاموس (عدّل فيها زي ما تحب)
              private val consonants: Map<Char, String> = mapOf(
                  'ب' to "b", 'ت' to "t", 'ث' to "th", 'ج' to "g",
                  'ح' to "7", 'خ' to "5", 'د' to "d", 'ذ' to "z",
                  'ر' to "r", 'ز' to "z", 'س' to "s", 'ش' to "sh",
                  'ص' to "9", 'ض' to "d", 'ط' to "6", 'ظ' to "z",
                  'ع' to "3", 'غ' to "gh", 'ف' to "f", 'ق' to "2",
                  'ك' to "k", 'ل' to "l", 'م' to "m", 'ن' to "n",
                  'ه' to "h", 'ء' to "2", 'ؤ' to "2", 'ئ' to "2"
              )

              // نهايات الكلمات (ضمائر) وطريقة كتابتها
              private val suffixes: List<Pair<String, String>> = listOf(
                  Pair("كم", "kom"), Pair("هم", "hom"), Pair("ها", "ha"),
                  Pair("ني", "ni"), Pair("نا", "na"), Pair("ك", "ak"), Pair("ه", "o")
              )

              private val repeatDelete = object : Runnable {
                  override fun run() {
                      doDelete()
                      handler.postDelayed(this, 60)
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  loadDict("words_default.txt")
                  loadDict("words_user.txt")
              }

              override fun onStartInputView(info: EditorInfo?, restarting: Boolean) {
                  super.onStartInputView(info, restarting)
                  resetWord()
              }

              private fun loadDict(name: String) {
                  try {
                      assets.open(name).bufferedReader(Charsets.UTF_8).useLines { lines ->
                          for (line in lines) {
                              val t = line.trim()
                              if (t.isEmpty() || t.startsWith("#")) continue
                              val idx = t.indexOf('=')
                              if (idx <= 0) continue
                              val key = normalize(t.substring(0, idx).trim())
                              val value = t.substring(idx + 1).trim()
                              if (key.isNotEmpty() && value.isNotEmpty()) dict[key] = value
                          }
                      }
                  } catch (e: Exception) {
                      // الملف مش موجود: عادي
                  }
              }

              private fun normalize(s: String): String {
                  val sb = StringBuilder()
                  for (c in s) {
                      when (c) {
                          'أ', 'إ', 'آ' -> sb.append('ا')
                          'ى' -> sb.append('ي')
                          'ة' -> sb.append('ه')
                          else -> sb.append(c)
                      }
                  }
                  return sb.toString()
              }

              private fun convertWord(word: String): String {
                  val hit = dict[normalize(word)]
                  return hit ?: fallback(word)
              }

              // كلمة مش في القاموس: نفصل ال والنهايات، ونحط الحركات بالتخمين
              private fun fallback(word: String): String {
                  if (word.length > 3 && word.startsWith("ال")) {
                      return "el" + convertWord(word.substring(2))
                  }
                  for (s in suffixes) {
                      val minStem = if (s.first.length == 1) 3 else 2
                      if (word.length >= s.first.length + minStem && word.endsWith(s.first)) {
                          val stemWord = word.substring(0, word.length - s.first.length)
                          val st = dict[normalize(stemWord)] ?: stem(stemWord)
                          return st + s.second
                      }
                  }
                  return stem(word)
              }

              private fun stem(word: String): String {
                  val units = ArrayList<String>()
                  val isCons = ArrayList<Boolean>()
                  for ((i, c) in word.withIndex()) {
                      when (c) {
                          'ا', 'أ', 'إ', 'آ', 'ى', 'ة' -> {
                              units.add("a")
                              isCons.add(false)
                          }
                          'و' -> {
                              units.add(if (i == 0) "w" else "o")
                              isCons.add(i == 0)
                          }
                          'ي' -> {
                              units.add(if (i == 0) "y" else "i")
                              isCons.add(i == 0)
                          }
                          else -> {
                              units.add(consonants[c] ?: c.toString())
                              isCons.add(true)
                          }
                      }
                  }
                  var nC = 0
                  var nV = 0
                  for (k in units.indices) {
                      if (isCons[k]) {
                          nC++
                      } else if (!(k == units.size - 1 && (word[k] == 'ة' || word[k] == 'ى'))) {
                          nV++
                      }
                  }
                  val sb = StringBuilder()
                  var ci = 0
                  for (k in units.indices) {
                      sb.append(units[k])
                      if (isCons[k]) {
                          val nextIsCons = (k + 1 < units.size) && isCons[k + 1]
                          if (nextIsCons) {
                              if (nC == 4 && nV == 0) {
                                  if (ci == 0 || ci == 2) sb.append("a")
                              } else {
                                  sb.append(if (ci == 0) "a" else "e")
                              }
                          }
                          ci++
                      }
                  }
                  return sb.toString()
              }

              private fun resetWord() {
                  wordAr.setLength(0)
                  wordFr = ""
              }

              private fun replaceWord(ic: InputConnection) {
                  val newFr = convertWord(wordAr.toString())
                  ic.beginBatchEdit()
                  if (wordFr.isNotEmpty()) ic.deleteSurroundingText(wordFr.length, 0)
                  ic.commitText(newFr, 1)
                  ic.endBatchEdit()
                  wordFr = newFr
              }

              private fun dp(v: Int): Int =
                  TypedValue.applyDimension(
                      TypedValue.COMPLEX_UNIT_DIP, v.toFloat(), resources.displayMetrics
                  ).toInt()

              override fun onCreateInputView(): View {
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.layoutDirection = View.LAYOUT_DIRECTION_LTR
                  root.setBackgroundColor(Color.parseColor("#1B1B1F"))
                  root.setPadding(dp(3), dp(4), dp(3), dp(6))

                  // صف الأرقام
                  val numbers = newRow()
                  for (ch in "1234567890") {
                      numbers.addView(makeKey(ch.toString(), 1f) { commitOther(ch.toString()) })
                  }
                  root.addView(numbers)

                  // صفوف الحروف
                  val rows = listOf(
                      "ضصثقفغعهخحج",
                      "شسيبلاتنمكط",
                      "ذءؤرىةوزظد"
                  )
                  for ((index, letters) in rows.withIndex()) {
                      val r = newRow()
                      for (ch in letters) {
                          r.addView(makeKey(ch.toString(), 1f) { typeLetter(ch) })
                      }
                      if (index == 2) {
                          val del = makeKey("⌫", 1.5f, "#55555F") { }
                          del.setOnTouchListener { _, event ->
                              when (event.action) {
                                  MotionEvent.ACTION_DOWN -> {
                                      doDelete()
                                      handler.postDelayed(repeatDelete, 400)
                                  }
                                  MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                                      handler.removeCallbacks(repeatDelete)
                                  }
                              }
                              true
                          }
                          r.addView(del)
                      }
                      root.addView(r)
                  }

                  // الصف الأخير
                  val bottom = newRow()
                  val toggle = makeKey("", 1.6f) { toggleFranco() }
                  toggleKey = toggle
                  refreshToggle()
                  bottom.addView(toggle)
                  bottom.addView(makeKey("🌐", 1f, "#55555F") {
                      val imm = getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager
                      imm.showInputMethodPicker()
                  })
                  bottom.addView(makeKey("،", 1f) { commitOther("،") })
                  bottom.addView(makeKey("مسافة", 4f) { commitOther(" ") })
                  bottom.addView(makeKey(".", 1f) { commitOther(".") })
                  bottom.addView(makeKey("⏎", 1.5f, "#3F51B5") { doEnter() })
                  root.addView(bottom)

                  return root
              }

              private fun newRow(): LinearLayout {
                  val r = LinearLayout(this)
                  r.orientation = LinearLayout.HORIZONTAL
                  r.layoutDirection = View.LAYOUT_DIRECTION_LTR
                  r.layoutParams = LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  )
                  return r
              }

              private fun makeKey(
                  label: String,
                  weight: Float,
                  color: String = "#3C3C45",
                  onClick: (View) -> Unit
              ): Button {
                  val b = Button(this)
                  b.text = label
                  b.isAllCaps = false
                  b.setTextColor(Color.WHITE)
                  b.setTextSize(TypedValue.COMPLEX_UNIT_SP, 18f)
                  b.setPadding(0, 0, 0, 0)
                  b.minWidth = 0
                  b.minHeight = 0
                  b.minimumWidth = 0
                  b.minimumHeight = 0
                  val bg = GradientDrawable()
                  bg.cornerRadius = dp(8).toFloat()
                  bg.setColor(Color.parseColor(color))
                  b.background = bg
                  val lp = LinearLayout.LayoutParams(0, dp(48), weight)
                  lp.setMargins(dp(2), dp(3), dp(2), dp(3))
                  b.layoutParams = lp
                  b.setOnClickListener { v -> onClick(v) }
                  return b
              }

              // أي حاجة مش حرف (مسافة، رقم، نقطة): تنهي الكلمة الحالية
              private fun commitOther(text: String) {
                  resetWord()
                  currentInputConnection?.commitText(text, 1)
              }

              private fun typeLetter(ch: Char) {
                  val ic = currentInputConnection ?: return
                  if (!francoOn) {
                      resetWord()
                      ic.commitText(ch.toString(), 1)
                      return
                  }
                  if (wordFr.isNotEmpty()) {
                      val before = ic.getTextBeforeCursor(wordFr.length, 0)?.toString() ?: ""
                      if (before != wordFr) resetWord()
                  }
                  wordAr.append(ch)
                  replaceWord(ic)
              }

              private fun toggleFranco() {
                  francoOn = !francoOn
                  resetWord()
                  refreshToggle()
              }

              private fun refreshToggle() {
                  val b = toggleKey ?: return
                  b.text = if (francoOn) "فرانكو ✓" else "عربي"
                  val bg = GradientDrawable()
                  bg.cornerRadius = dp(8).toFloat()
                  bg.setColor(Color.parseColor(if (francoOn) "#2E7D32" else "#55555F"))
                  b.background = bg
              }

              private fun doDelete() {
                  val ic = currentInputConnection ?: return
                  val selected = ic.getSelectedText(0)
                  if (selected != null && selected.isNotEmpty()) {
                      ic.commitText("", 1)
                      resetWord()
                      return
                  }
                  if (francoOn && wordAr.isNotEmpty() && wordFr.isNotEmpty()) {
                      val before = ic.getTextBeforeCursor(wordFr.length, 0)?.toString() ?: ""
                      if (before == wordFr) {
                          wordAr.setLength(wordAr.length - 1)
                          if (wordAr.isEmpty()) {
                              ic.deleteSurroundingText(wordFr.length, 0)
                              wordFr = ""
                          } else {
                              replaceWord(ic)
                          }
                          return
                      }
                  }
                  resetWord()
                  ic.deleteSurroundingText(1, 0)
              }

              private fun doEnter() {
                  resetWord()
                  val ic = currentInputConnection ?: return
                  val options = currentInputEditorInfo?.imeOptions ?: 0
                  val action = options and EditorInfo.IME_MASK_ACTION
                  val noEnterAction = (options and EditorInfo.IME_FLAG_NO_ENTER_ACTION) != 0
                  if (!noEnterAction &&
                      action != EditorInfo.IME_ACTION_NONE &&
                      action != EditorInfo.IME_ACTION_UNSPECIFIED
                  ) {
                      ic.performEditorAction(action)
                  } else {
                      sendDownUpKeyEvents(KeyEvent.KEYCODE_ENTER)
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/outputs/apk/debug/*-debug.apk franco-keyboard.apk
          gh release create "v${{ github.run_number }}" franco-keyboard.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Franco Keyboard ${{ github.run_number }}" \
            --notes "ملف APK جاهز للتثبيت"
