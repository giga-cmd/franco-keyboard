name: Build Franco Apps

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build all Franco projects (keyboard + AI + translate engine)
        env:
          ZIP_PASS: ${{ secrets.ZIP_PASS }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          mkdir -p out

          build_one() {
            PREFIX="$1"; APK="$2"; REQUIRED="$3"
            ZIP=$(find . -maxdepth 1 -type f \( -name "${PREFIX}_v*.zip" -o -name "${PREFIX}_v*.zip.enc" \) -printf '%f\n' | sort -V | tail -n 1)
            if [ -z "$ZIP" ]; then
              if [ "$REQUIRED" = "1" ]; then echo "No ${PREFIX}_v* project found"; exit 1; fi
              echo "Skipping $PREFIX (no file)"; return 0
            fi
            echo "=== Building $ZIP ==="
            W="work_$PREFIX"
            rm -rf "$W"; mkdir "$W"
            case "$ZIP" in
              *.enc)
                [ -n "$ZIP_PASS" ] || { echo "Secret ZIP_PASS is missing"; exit 1; }
                openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:ZIP_PASS -in "$ZIP" -out "$W.zip" || { echo "Wrong ZIP_PASS or corrupt file"; exit 1; }
                unzip -q "$W.zip" -d "$W"; rm -f "$W.zip" ;;
              *) unzip -q "$ZIP" -d "$W" ;;
            esac
            if [ ! -f "$W/build.gradle.kts" ]; then
              INNER=$(find "$W" -maxdepth 2 -name build.gradle.kts -printf '%h\n' | head -n 1)
              if [ -n "$INNER" ]; then shopt -s dotglob; mv "$INNER"/* "$W"/; shopt -u dotglob; fi
            fi
            test -f "$W/build.gradle.kts" || { echo "build.gradle.kts not found in $ZIP"; exit 1; }
            if [ "$PREFIX" = "FrancoKeyboard" ]; then
              test -f "$W/google-services.json" || { echo "google-services.json missing"; exit 1; }
              if [ -f words.txt ]; then
                mkdir -p "$W/src/main/assets"; cp words.txt "$W/src/main/assets/words_user.txt"
              fi
            fi
            if [ "$PREFIX" = "FrancoAI" ]; then
              mkdir -p "$W/src/main/assets"
              if [ -n "$GEMINI_KEY" ]; then
                printf '%s' "$GEMINI_KEY" > "$W/src/main/assets/ai_key.txt"
              else
                echo "WARNING: secret GEMINI_KEY is missing, AI will not work"
              fi
            fi
            gradle -p "$W" assembleDebug --no-daemon --stacktrace -PrunNumber=${{ github.run_number }}
            cp "$W"/build/outputs/apk/debug/*-debug.apk "out/$APK"
          }

          build_one FrancoKeyboard franco-keyboard.apk 1
          build_one FrancoAI franco-ai.apk 0
          build_one FrancoTranslateEngine franco-translate-engine.apk 0
          ls -la out

      - name: Publish APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release delete "v${{ github.run_number }}" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          cat > notes.md <<'NOTES_EOF'
          Franco Keyboard

          كيبورد فرانكو بمميزات وأدوات متعددة لتجربة كتابة سهلة وقابلة للتخصيص.
          يمكنك تحويل كلامك من عربي الي فرانكو وعكس صحيح دون حاجه للخروج من الكيبورد
          أبرز المميزات ✨

          • كيبورد كامل متكامل.
          • يوجد بداخله مايك يحول كلامك ل فرانكو.
          • التصحيح التلقائي واقتراح الكلمات.
          • التحويل من الفرانكو الي العربي.
          • الترجمة الفورية.
          • تخصيص شكل الكيبورد بالخلفيات والصور والفيديوهات.
          • مع إمكانية تحميل ملفات الخطوط وتثبيتها داخل الكيبورد للحصول على تجربة شكل iPhone، دعم خطوط وإيموجي كيبورد الآيفون.

          والمزيد من المميزات والأدوات الأخرى داخل التطبيق!

          الملفات في الإصدار:
          • franco-keyboard.apk : الكيبورد
          • franco-ai.apk : الذكاء الاصطناعي (اختياري، بيشتغل من الكيبورد بس)
          • franco-translate-engine.apk : الترجمة بدون نت (اختياري)

          Developed by Giga
          NOTES_EOF
          gh release create "v${{ github.run_number }}" out/*.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Franco Keyboard ${{ github.run_number }}" \
            --notes-file notes.md
