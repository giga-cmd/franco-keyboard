name: Build Franco Keyboard

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unpack latest Franco project only
        run: |
          set -e
          mkdir work
          PROJECT_ZIP=$(find . -maxdepth 1 -type f -name 'FrancoKeyboard_v*.zip' -printf '%f\n' | sort -V | tail -n 1)
          if [ -z "$PROJECT_ZIP" ]; then
            echo "No FrancoKeyboard_v*.zip project found"
            exit 1
          fi
          echo "Building project: $PROJECT_ZIP"
          unzip -q "$PROJECT_ZIP" -d work
          if [ -f words.txt ]; then
            mkdir -p work/src/main/assets
            cp words.txt work/src/main/assets/words_user.txt
          fi

      - name: Build APK
        run: gradle -p work assembleDebug --no-daemon

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp work/build/outputs/apk/debug/*-debug.apk franco-keyboard.apk
          cat > notes.md <<'NOTES_EOF'
          Franco Keyboard

          كيبورد فرانكو بمميزات وأدوات متعددة لتجربة كتابة سهلة وقابلة للتخصيص.
          يمكنك تحويل كلامك من عربي الي فرانكو وعكس صحيح دون حاجه للخروج من الكيبورد
          أبرز المميزات ✨

          • كيبورد كامل متكامل.
          • يوجد بداخله مايك يحول كلامك ل فرانكو.
          • التصحيح التلقائي واقتراح الكلمات.
          • التحويل من الفرانكو الي العربي.
          • الترجمة الفورية.
          • تخصيص شكل الكيبورد بالخلفيات والصور والفيديوهات.
          • مع إمكانية تحميل ملفات الخطوط وتثبيتها داخل الكيبورد للحصول على تجربة شكل iPhone، دعم خطوط وإيموجي كيبورد الآيفون.

          والمزيد من المميزات والأدوات الأخرى داخل التطبيق!

          Developed by Giga
          NOTES_EOF
          gh release create "v${{ github.run_number }}" franco-keyboard.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Franco Keyboard ${{ github.run_number }}" \
            --notes-file notes.md
