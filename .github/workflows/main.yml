name: Build Franco Keyboard

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Unpack latest projects (keyboard + translate engine)
        env:
          ZIP_PASS: ${{ secrets.ZIP_PASS }}
        run: |
          set -e
          # unpack <prefix> <outdir>: بيفك أحدث ملف <prefix>_v*.zip أو .zip.enc جوه <outdir>
          unpack() {
            local PZ
            PZ=$(find . -maxdepth 1 -type f \( -name "$1_v*.zip" -o -name "$1_v*.zip.enc" \) -printf '%f\n' | sort -V | tail -n 1)
            if [ -z "$PZ" ]; then
              return 1
            fi
            echo "Building project: $PZ"
            mkdir -p "$2"
            case "$PZ" in
              *.enc)
                if [ -z "$ZIP_PASS" ]; then
                  echo "Secret ZIP_PASS is missing (Settings > Secrets and variables > Actions)"
                  exit 1
                fi
                openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:ZIP_PASS -in "$PZ" -out "$2.zip" || { echo "Wrong ZIP_PASS or corrupt file: $PZ"; exit 1; }
                unzip -q "$2.zip" -d "$2"
                rm -f "$2.zip"
                ;;
              *)
                unzip -q "$PZ" -d "$2"
                ;;
            esac
            # لو الزيب اتعمل بفولدر واحد جواه، اطلع بمحتواه لمستوى الفولدر
            if [ ! -f "$2/build.gradle.kts" ]; then
              INNER=$(find "$2" -maxdepth 2 -name build.gradle.kts -printf '%h\n' | head -n 1)
              if [ -n "$INNER" ]; then
                shopt -s dotglob
                mv "$INNER"/* "$2"/
              fi
            fi
            test -f "$2/build.gradle.kts" || { echo "build.gradle.kts not found in $PZ"; exit 1; }
          }

          unpack FrancoKeyboard work || { echo "No FrancoKeyboard_v* project found"; exit 1; }
          test -f work/google-services.json || { echo "google-services.json missing in zip"; exit 1; }
          if [ -f words.txt ]; then
            mkdir -p work/src/main/assets
            cp words.txt work/src/main/assets/words_user.txt
          fi
          # خطوطك وثيماتك (بتترجع تلقائيًا بعد أي تحديث): حطها في الريبو جوه فولدر seed
          #   seed/fonts/*.ttf  و  seed/franco-backup.json
          if [ -d seed/fonts ]; then
            mkdir -p work/src/main/assets/seed_fonts
            cp seed/fonts/* work/src/main/assets/seed_fonts/ 2>/dev/null || true
          fi
          if [ -f seed/franco-backup.json ]; then
            mkdir -p work/src/main/assets
            cp seed/franco-backup.json work/src/main/assets/seed_backup.json
          fi

          # تطبيق محرك الترجمة (اختياري: لو الملف موجود بيتبني)
          if unpack FrancoTranslateEngine engine_work; then
            echo "HAVE_ENGINE=1" >> "$GITHUB_ENV"
          else
            echo "No FrancoTranslateEngine_v* project found, skipping engine"
          fi

          # تطبيق Franco Data: مخزن دائم للخطوط والثيمات (اختياري)
          if unpack FrancoData data_work; then
            echo "HAVE_DATA=1" >> "$GITHUB_ENV"
          else
            echo "No FrancoData_v* project found, skipping data app"
          fi

      - name: Build keyboard APK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          gradle -p work assembleDebug --no-daemon --stacktrace -PrunNumber=${{ github.run_number }}

      - name: Build translate engine APK
        if: env.HAVE_ENGINE == '1'
        run: |
          gradle -p engine_work assembleDebug --no-daemon --stacktrace -PrunNumber=${{ github.run_number }}

      - name: Build Franco Data APK
        if: env.HAVE_DATA == '1'
        run: |
          gradle -p data_work assembleDebug --no-daemon --stacktrace -PrunNumber=${{ github.run_number }}

      - name: Publish APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp work/build/outputs/apk/debug/*-debug.apk franco-keyboard.apk
          FILES="franco-keyboard.apk"
          if [ "$HAVE_ENGINE" = "1" ]; then
            cp engine_work/build/outputs/apk/debug/*-debug.apk franco-translate-engine.apk
            FILES="$FILES franco-translate-engine.apk"
          fi
          if [ "$HAVE_DATA" = "1" ]; then
            cp data_work/build/outputs/apk/debug/*-debug.apk franco-data.apk
            FILES="$FILES franco-data.apk"
          fi
          gh release delete "v${{ github.run_number }}" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          cat > notes.md <<'NOTES_EOF'
          Franco Keyboard

          كيبورد فرانكو بمميزات وأدوات متعددة لتجربة كتابة سهلة وقابلة للتخصيص.
          يمكنك تحويل كلامك من عربي الي فرانكو وعكس صحيح دون حاجه للخروج من الكيبورد
          أبرز المميزات ✨

          • كيبورد كامل متكامل.
          • يوجد بداخله مايك يحول كلامك ل فرانكو.
          • التصحيح التلقائي واقتراح الكلمات.
          • التحويل من الفرانكو الي العربي.
          • الترجمة الفورية.
          • تخصيص شكل الكيبورد بالخلفيات والصور والفيديوهات.
          • مع إمكانية تحميل ملفات الخطوط وتثبيتها داخل الكيبورد للحصول على تجربة شكل iPhone، دعم خطوط وإيموجي كيبورد الآيفون.

          والمزيد من المميزات والأدوات الأخرى داخل التطبيق!

          📥 للترجمة بدون نت: ثبّت franco-translate-engine.apk كمان (تطبيق منفصل) وحمّل منه اللغات.
          🗄 للخطوط والثيمات الدائمة: ثبّت franco-data.apk مرة واحدة وضيف فيه خطوطك.

          Developed by Giga
          NOTES_EOF
          gh release create "v${{ github.run_number }}" $FILES \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Franco Keyboard ${{ github.run_number }}" \
            --notes-file notes.md
