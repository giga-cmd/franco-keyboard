name: Build Franco AI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Unpack latest Franco project only
        env:
          ZIP_PASS: ${{ secrets.ZIP_PASS }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          set -e
          mkdir work
          PROJECT_ZIP=$(find . -maxdepth 1 -type f \( -name 'FrancoAI_v*.zip' -o -name 'FrancoAI_v*.zip.enc' \) -printf '%f\n' | sort -V | tail -n 1)
          if [ -z "$PROJECT_ZIP" ]; then
            echo "No FrancoAI_v* project found"
            exit 1
          fi
          echo "Building project: $PROJECT_ZIP"
          case "$PROJECT_ZIP" in
            *.enc)
              if [ -z "$ZIP_PASS" ]; then
                echo "Secret ZIP_PASS is missing (Settings > Secrets and variables > Actions)"
                exit 1
              fi
              openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:ZIP_PASS -in "$PROJECT_ZIP" -out project.zip || { echo "Wrong ZIP_PASS or corrupt file"; exit 1; }
              unzip -q project.zip -d work
              rm -f project.zip
              ;;
            *)
              unzip -q "$PROJECT_ZIP" -d work
              ;;
          esac
          # لو الزيب اتعمل بفولدر واحد جواه، اطلع بمحتواه لمستوى work
          if [ ! -f work/build.gradle.kts ]; then
            INNER=$(find work -maxdepth 2 -name build.gradle.kts -printf '%h\n' | head -n 1)
            if [ -n "$INNER" ]; then
              shopt -s dotglob
              mv "$INNER"/* work/
            fi
          fi
          test -f work/build.gradle.kts || { echo "build.gradle.kts not found in zip"; exit 1; }
          mkdir -p work/src/main/assets
          if [ -n "$GEMINI_KEY" ]; then
            printf '%s' "$GEMINI_KEY" > work/src/main/assets/ai_key.txt
          else
            echo "WARNING: secret GEMINI_KEY is missing, AI will not work"
          fi

      - name: Build APK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          gradle -p work assembleDebug --no-daemon --stacktrace -PrunNumber=${{ github.run_number }}

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp work/build/outputs/apk/debug/*-debug.apk franco-ai.apk
          gh release delete "v${{ github.run_number }}" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          cat > notes.md <<'NOTES_EOF'
          Franco AI

          الذكاء الاصطناعي المرافق لكيبورد فرانكو. مش بيتفتح بإيدك: كيبورد فرانكو بيكلّمه (زر 🤖) للأسئلة بالنص والصوت والصور، وللترجمة الأدق.

          Developed by Giga
          NOTES_EOF
          gh release create "v${{ github.run_number }}" franco-ai.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Franco AI ${{ github.run_number }}" \
            --notes-file notes.md
